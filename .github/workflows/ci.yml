name: CI

# Runs only when started by hand: GitHub -> Actions -> CI -> "Run workflow".
# Pushes to main no longer start it; every change is checked on the demo site instead.
on:
  workflow_dispatch:

concurrency:
  group: ci-pepl_os-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      redis-cache:
        image: redis:alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:alpine
        ports: ["11000:6379"]
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - uses: actions/checkout@v5

      # Match these to the versions shown on your Frappe Cloud bench.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Init bench on Frappe v16
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets \
            --frappe-branch version-16 --python "$(which python)" ~/frappe-bench
          mariadb -h 127.0.0.1 -P 3306 -u root -proot -e "SET GLOBAL character_set_server='utf8mb4'"
          mariadb -h 127.0.0.1 -P 3306 -u root -proot -e "SET GLOBAL collation_server='utf8mb4_unicode_ci'"

      - name: Get apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app erpnext --branch version-16
          bench get-app https://x-access-token:${{ secrets.PEPL_SALES_TOKEN }}@github.com/erp-pepl/pepl_sales --branch main
          bench get-app pepl_os $GITHUB_WORKSPACE
          bench setup requirements --dev

      - name: Create site and install apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app pepl_sales
          bench --site test_site install-app pepl_os

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app pepl_os
